<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mirrord Debugger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            border-bottom: 2px solid #3c3c3c;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 32px;
            font-weight: 600;
            color: #ffffff;
        }

        .subtitle {
            color: #858585;
            margin-top: 8px;
        }

        .status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            margin-left: 12px;
        }

        .status.connected {
            background: #1a472a;
            color: #4ec9b0;
        }

        .status.disconnected {
            background: #4a1a1a;
            color: #f48771;
        }

        .intproxy-list {
            display: grid;
            gap: 20px;
        }

        .intproxy-card {
            background: #252526;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            padding: 20px;
            transition: border-color 0.2s;
        }

        .intproxy-card:hover {
            border-color: #007acc;
        }

        .intproxy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px solid #3c3c3c;
        }

        .intproxy-id {
            font-size: 18px;
            font-weight: 600;
            color: #4ec9b0;
            font-family: 'Courier New', monospace;
        }

        .intproxy-meta {
            font-size: 13px;
            color: #858585;
        }

        .layers {
            display: grid;
            gap: 8px;
        }

        .layer {
            background: #2d2d30;
            border-left: 3px solid #007acc;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .layer:hover {
            background: #3c3c3f;
        }

        .layer-tree {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .layer-indent {
            margin-left: 24px;
            border-left: 2px solid #3c3c3c;
            padding-left: 12px;
        }

        .parent-indicator {
            font-size: 11px;
            color: #858585;
            margin-top: 4px;
        }

        .layer-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 8px;
        }

        .process-name {
            font-size: 16px;
            font-weight: 500;
            color: #dcdcaa;
        }

        .process-pid {
            font-size: 13px;
            color: #858585;
            font-family: 'Courier New', monospace;
        }

        .process-cmdline {
            font-size: 12px;
            color: #9cdcfe;
            font-family: 'Courier New', monospace;
            margin-top: 4px;
            overflow-x: auto;
            white-space: nowrap;
        }

        .layer-id {
            font-size: 12px;
            color: #858585;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #858585;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .reconnecting-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: #4a1a1a;
            color: #f48771;
            padding: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            display: none;
        }

        .reconnecting-overlay.show {
            display: block;
        }

        /* Message Console Modal */
        .console-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
        }

        .console-modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .console-content {
            background: #1e1e1e;
            border: 1px solid #3c3c3c;
            border-radius: 8px;
            width: 90%;
            max-width: 1200px;
            height: 80%;
            display: flex;
            flex-direction: column;
        }

        .console-header {
            padding: 20px;
            border-bottom: 1px solid #3c3c3c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console-title {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
        }

        .console-close {
            background: none;
            border: none;
            color: #858585;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .console-close:hover {
            color: #ffffff;
        }

        .console-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message-log-entry {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            padding: 8px 12px;
            border-left: 3px solid #858585;
            margin-bottom: 4px;
            background: #252526;
            border-radius: 2px;
        }

        .message-log-entry.from-layer {
            border-left-color: #4ec9b0;
        }

        .message-log-entry.to-layer {
            border-left-color: #dcdcaa;
        }

        .message-meta {
            display: flex;
            gap: 16px;
            margin-bottom: 4px;
            color: #858585;
        }

        .message-direction {
            font-weight: 600;
        }

        .message-direction.from-layer {
            color: #4ec9b0;
        }

        .message-direction.to-layer {
            color: #dcdcaa;
        }

        .message-type {
            color: #9cdcfe;
        }

        .message-timestamp {
            color: #858585;
            margin-left: auto;
        }

        .empty-console {
            text-align: center;
            padding: 60px 20px;
            color: #858585;
        }
    </style>
</head>
<body>
    <div class="reconnecting-overlay" id="reconnecting">
        Reconnecting to debugger server...
    </div>

    <!-- Message Console Modal -->
    <div class="console-modal" id="console-modal">
        <div class="console-content">
            <div class="console-header">
                <div class="console-title" id="console-title">Message Console</div>
                <button class="console-close" onclick="closeConsole()">&times;</button>
            </div>
            <div class="console-body" id="console-body">
                <div class="empty-console">No messages yet</div>
            </div>
        </div>
    </div>

    <header>
        <h1>
            mirrord Debugger
            <span class="status connected" id="status">Connected</span>
        </h1>
        <div class="subtitle">Real-time monitoring of intproxy instances and connected processes</div>
    </header>

    <main>
        <div class="intproxy-list" id="intproxy-list">
            <div class="empty-state">
                <div class="empty-state-icon">📡</div>
                <div>No intproxy instances connected</div>
                <div style="margin-top: 8px; font-size: 13px;">Run a mirrord command to see processes here</div>
            </div>
        </div>
    </main>

    <script>
        let ws = null;
        let reconnectAttempts = 0;
        const maxReconnectDelay = 5000;
        let currentLayerId = null;
        const layerLogs = new Map(); // layer_id -> array of logs

        function connect() {
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws?token=${token}`;

            ws = new WebSocket(wsUrl);

            ws.onopen = () => {
                console.log('WebSocket connected');
                reconnectAttempts = 0;
                updateConnectionStatus(true);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);

                if (data.type === 'Snapshot') {
                    renderIntproxies(data.intproxies);
                } else if (data.type === 'MessageLog') {
                    handleMessageLog(data.layer_id, data.log);
                }
            };

            ws.onerror = (error) => {
                console.error('WebSocket error:', error);
            };

            ws.onclose = () => {
                console.log('WebSocket disconnected');
                updateConnectionStatus(false);
                scheduleReconnect();
            };
        }

        function scheduleReconnect() {
            const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), maxReconnectDelay);
            reconnectAttempts++;
            console.log(`Reconnecting in ${delay}ms...`);
            setTimeout(connect, delay);
        }

        function updateConnectionStatus(connected) {
            const statusEl = document.getElementById('status');
            const reconnectingEl = document.getElementById('reconnecting');

            if (connected) {
                statusEl.textContent = 'Connected';
                statusEl.className = 'status connected';
                reconnectingEl.classList.remove('show');
            } else {
                statusEl.textContent = 'Disconnected';
                statusEl.className = 'status disconnected';
                reconnectingEl.classList.add('show');
            }
        }

        function buildLayerTree(layers) {
            // Build a map of PID -> layer
            const layerByPid = new Map();
            layers.forEach(layer => {
                layerByPid.set(layer.process_info.pid, layer);
            });

            // Build parent-child relationships
            const roots = [];
            const childrenMap = new Map();

            layers.forEach(layer => {
                const parentPid = layer.process_info.parent_pid;
                const hasParentInLayers = layerByPid.has(parentPid);

                if (hasParentInLayers) {
                    // Add to children of parent
                    if (!childrenMap.has(parentPid)) {
                        childrenMap.set(parentPid, []);
                    }
                    childrenMap.get(parentPid).push(layer);
                } else {
                    // Root layer (no parent in this intproxy)
                    roots.push(layer);
                }
            });

            return { roots, childrenMap };
        }

        function renderLayerTree(layer, childrenMap, depth = 0) {
            const indent = depth > 0 ? 'layer-indent' : '';
            const children = childrenMap.get(layer.process_info.pid) || [];
            const hasChildren = children.length > 0;
            const parentInfo = depth === 0 && layer.process_info.parent_pid > 0
                ? `<div class="parent-indicator">Parent PID: ${layer.process_info.parent_pid}</div>`
                : '';

            let html = `
                <div class="${indent}">
                    <div class="layer" onclick="openConsole(${layer.layer_id}, '${escapeHtml(layer.process_info.name)}')">
                        <div class="layer-header">
                            <span class="process-name">${escapeHtml(layer.process_info.name)}</span>
                            <span class="process-pid">PID ${layer.process_info.pid}</span>
                        </div>
                        <div class="process-cmdline">${escapeHtml(layer.process_info.cmdline.join(' '))}</div>
                        <div class="layer-id">Layer ID: ${layer.layer_id}${hasChildren ? ' · ' + children.length + ' child' + (children.length > 1 ? 'ren' : '') : ''}</div>
                        ${parentInfo}
                    </div>
            `;

            // Render children recursively
            if (hasChildren) {
                children.forEach(child => {
                    html += renderLayerTree(child, childrenMap, depth + 1);
                });
            }

            html += '</div>';
            return html;
        }

        function renderIntproxies(intproxies) {
            const listEl = document.getElementById('intproxy-list');

            if (Object.keys(intproxies).length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📡</div>
                        <div>No intproxy instances connected</div>
                        <div style="margin-top: 8px; font-size: 13px;">Run a mirrord command to see processes here</div>
                    </div>
                `;
                return;
            }

            const html = Object.entries(intproxies).map(([id, info]) => {
                const lastHeartbeat = new Date(info.last_heartbeat * 1000).toLocaleString();
                let layersHtml;

                if (info.layers.length === 0) {
                    layersHtml = '<div style="color: #858585; font-size: 13px;">No layers connected</div>';
                } else {
                    const { roots, childrenMap } = buildLayerTree(info.layers);
                    layersHtml = '<div class="layer-tree">' +
                        roots.map(root => renderLayerTree(root, childrenMap)).join('') +
                        '</div>';
                }

                return `
                    <div class="intproxy-card">
                        <div class="intproxy-header">
                            <div class="intproxy-id">${escapeHtml(id)}</div>
                            <div class="intproxy-meta">Port ${info.port} · ${lastHeartbeat}</div>
                        </div>
                        <div class="layers">${layersHtml}</div>
                    </div>
                `;
            }).join('');

            listEl.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function handleMessageLog(layerId, log) {
            if (!layerLogs.has(layerId)) {
                layerLogs.set(layerId, []);
            }
            const logs = layerLogs.get(layerId);
            logs.push(log);

            // Keep only last 1000 messages
            if (logs.length > 1000) {
                logs.shift();
            }

            // If console is currently open for this layer, update it
            if (currentLayerId === layerId) {
                renderConsole(layerId);
            }
        }

        async function openConsole(layerId, processName) {
            currentLayerId = layerId;

            // Set title
            document.getElementById('console-title').textContent = `Message Console - ${processName} (Layer ${layerId})`;

            // Fetch initial logs if not already cached
            if (!layerLogs.has(layerId)) {
                const params = new URLSearchParams(window.location.search);
                const token = params.get('token');
                try {
                    const response = await fetch(`/logs/${layerId}?token=${token}`);
                    if (response.ok) {
                        const logs = await response.json();
                        layerLogs.set(layerId, logs);
                    }
                } catch (e) {
                    console.error('Failed to fetch logs:', e);
                }
            }

            renderConsole(layerId);
            document.getElementById('console-modal').classList.add('show');
        }

        function closeConsole() {
            document.getElementById('console-modal').classList.remove('show');
            currentLayerId = null;
        }

        function renderConsole(layerId) {
            const consoleBody = document.getElementById('console-body');
            const logs = layerLogs.get(layerId) || [];

            if (logs.length === 0) {
                consoleBody.innerHTML = '<div class="empty-console">No messages yet</div>';
                return;
            }

            const html = logs.map(log => {
                const directionClass = log.direction === 'FromLayer' ? 'from-layer' : 'to-layer';
                const directionText = log.direction === 'FromLayer' ? '→ FROM' : '← TO';
                const timestamp = new Date(log.timestamp).toLocaleTimeString();

                return `
                    <div class="message-log-entry ${directionClass}">
                        <div class="message-meta">
                            <span class="message-direction ${directionClass}">${directionText}</span>
                            <span class="message-type">${escapeHtml(log.message_type)}</span>
                            <span>Length: ${log.length}</span>
                            <span class="message-timestamp">${timestamp}</span>
                        </div>
                    </div>
                `;
            }).join('');

            consoleBody.innerHTML = html;

            // Auto-scroll to bottom
            consoleBody.scrollTop = consoleBody.scrollHeight;
        }

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeConsole();
            }
        });

        // Close modal on background click
        document.getElementById('console-modal').addEventListener('click', (e) => {
            if (e.target.id === 'console-modal') {
                closeConsole();
            }
        });

        // Start connection
        connect();
    </script>
</body>
</html>
